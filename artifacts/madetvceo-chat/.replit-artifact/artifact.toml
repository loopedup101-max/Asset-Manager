kind = "web"
previewPath = "/"
title = "MadeTVCEO Chat"
version = "1.0.0"
id = "artifacts/madetvceo-chat"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23637

[services.development]
run = "pnpm --filter @workspace/madetvceo-chat run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/madetvceo-chat", "run", "build" ]
publicDir = "artifacts/madetvceo-chat/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23637"
BASE_PATH = "/"
