openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Made Super AI Agent API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: conversations
    description: Conversation management
  - name: messages
    description: Message operations
  - name: stats
    description: Statistics and summaries
  - name: social
    description: Social media management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /conversations:
    get:
      operationId: listConversations
      tags: [conversations]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
    post:
      operationId: createConversation
      tags: [conversations]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"

  /conversations/{id}:
    get:
      operationId: getConversation
      tags: [conversations]
      summary: Get a conversation by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "404":
          description: Not found
    patch:
      operationId: updateConversation
      tags: [conversations]
      summary: Update a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationUpdate"
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "404":
          description: Not found
    delete:
      operationId: deleteConversation
      tags: [conversations]
      summary: Delete a conversation and all its messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /conversations/{id}/messages:
    get:
      operationId: listMessages
      tags: [messages]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        "404":
          description: Conversation not found
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a message in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Message sent with assistant reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessagePair"
        "404":
          description: Conversation not found

  /stats/summary:
    get:
      operationId: getStatsSummary
      tags: [stats]
      summary: Get chat stats summary
      responses:
        "200":
          description: Summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsSummary"

  /social/accounts:
    get:
      operationId: listSocialAccounts
      tags: [social]
      summary: List connected social accounts
      responses:
        "200":
          description: Connected accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SocialAccount"
    post:
      operationId: connectSocialAccount
      tags: [social]
      summary: Connect a social media account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialAccountInput"
      responses:
        "201":
          description: Account connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialAccount"

  /social/accounts/{id}:
    delete:
      operationId: disconnectSocialAccount
      tags: [social]
      summary: Disconnect a social account
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Disconnected

  /social/posts:
    get:
      operationId: listSocialPosts
      tags: [social]
      summary: List social posts
      responses:
        "200":
          description: Posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SocialPost"
    post:
      operationId: createSocialPost
      tags: [social]
      summary: Create or schedule a social post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialPostInput"
      responses:
        "201":
          description: Post created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialPost"

  /social/posts/{id}:
    patch:
      operationId: updateSocialPost
      tags: [social]
      summary: Update a social post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SocialPostUpdate"
      responses:
        "200":
          description: Updated post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialPost"
    delete:
      operationId: deleteSocialPost
      tags: [social]
      summary: Delete a social post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /social/generate:
    post:
      operationId: generateSocialContent
      tags: [social]
      summary: AI-generate post content or video script
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContentGenerateInput"
      responses:
        "200":
          description: Generated content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedContent"

  /social/stats:
    get:
      operationId: getSocialStats
      tags: [social]
      summary: Get social media stats overview
      responses:
        "200":
          description: Social stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialStats"

  /email/status:
    get:
      operationId: getEmailStatus
      tags: [email]
      summary: Whether an email account is connected and its from address
      responses:
        "200":
          description: Email connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailStatus"

  /email/generate:
    post:
      operationId: generateEmail
      tags: [email]
      summary: AI-draft an email (subject + body)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailGenerateInput"
      responses:
        "200":
          description: Drafted email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailDraft"

  /email/send:
    post:
      operationId: sendEmail
      tags: [email]
      summary: Send an email from the connected account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailSendInput"
      responses:
        "201":
          description: Email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SentEmail"

  /email/sent:
    get:
      operationId: listSentEmails
      tags: [email]
      summary: List emails this user has sent
      responses:
        "200":
          description: Sent emails
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SentEmail"

  /email/inbox/scan:
    get:
      operationId: scanInbox
      tags: [email]
      summary: Owner-only read-only scan of the connected inbox for cleanup
      responses:
        "200":
          description: Inbox cleanup analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxScan"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Conversation:
      type: object
      required: [id, title, createdAt, updatedAt, messageCount]
      properties:
        id:
          type: integer
        title:
          type: string
        lastMessage:
          type: ["string", "null"]
        messageCount:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string

    ConversationInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1

    ConversationUpdate:
      type: object
      properties:
        title:
          type: string
        lastMessage:
          type: string

    Message:
      type: object
      required: [id, conversationId, role, content, createdAt]
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
        createdAt:
          type: string

    MessageInput:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1

    MessagePair:
      type: object
      required: [userMessage, assistantMessage]
      properties:
        userMessage:
          $ref: "#/components/schemas/Message"
        assistantMessage:
          $ref: "#/components/schemas/Message"

    StatsSummary:
      type: object
      required: [totalConversations, totalMessages, todayMessages]
      properties:
        totalConversations:
          type: integer
        totalMessages:
          type: integer
        todayMessages:
          type: integer
        recentConversations:
          type: array
          items:
            $ref: "#/components/schemas/Conversation"

    SocialAccount:
      type: object
      required: [id, platform, username, connected, createdAt]
      properties:
        id:
          type: integer
        platform:
          type: string
          enum: [twitter, youtube, instagram, tiktok, facebook, linkedin]
        username:
          type: string
        connected:
          type: boolean
        apiKey:
          type: ["string", "null"]
        createdAt:
          type: string

    SocialAccountInput:
      type: object
      required: [platform, username]
      properties:
        platform:
          type: string
          enum: [twitter, youtube, instagram, tiktok, facebook, linkedin]
        username:
          type: string
        apiKey:
          type: string
        apiSecret:
          type: string
        accessToken:
          type: string

    SocialPost:
      type: object
      required: [id, platform, content, status, createdAt]
      properties:
        id:
          type: integer
        platform:
          type: string
        content:
          type: string
        status:
          type: string
          enum: [draft, scheduled, published, failed]
        scheduledAt:
          type: ["string", "null"]
        publishedAt:
          type: ["string", "null"]
        postType:
          type: string
          enum: [text, video, image]
        videoScript:
          type: ["string", "null"]
        createdAt:
          type: string

    SocialPostInput:
      type: object
      required: [platform, content]
      properties:
        platform:
          type: string
        content:
          type: string
        status:
          type: string
          enum: [draft, scheduled]
        scheduledAt:
          type: string
        postType:
          type: string
          enum: [text, video, image]
        videoScript:
          type: string

    SocialPostUpdate:
      type: object
      properties:
        content:
          type: string
        status:
          type: string
          enum: [draft, scheduled, published, failed]
        scheduledAt:
          type: string

    ContentGenerateInput:
      type: object
      required: [topic, platform]
      properties:
        topic:
          type: string
        platform:
          type: string
        contentType:
          type: string
          enum: [post, video_script, caption, thread]
        tone:
          type: string
          enum: [professional, casual, energetic, educational]

    GeneratedContent:
      type: object
      required: [content, platform, contentType]
      properties:
        content:
          type: string
        platform:
          type: string
        contentType:
          type: string
        suggestions:
          type: array
          items:
            type: string

    SocialStats:
      type: object
      required: [totalPosts, scheduled, published, connectedAccounts]
      properties:
        totalPosts:
          type: integer
        scheduled:
          type: integer
        published:
          type: integer
        connectedAccounts:
          type: integer
        platformBreakdown:
          type: array
          items:
            type: object
            required: [platform, count]
            properties:
              platform:
                type: string
              count:
                type: integer

    EmailStatus:
      type: object
      required: [connected]
      properties:
        connected:
          type: boolean
        fromAddress:
          type: ["string", "null"]

    EmailGenerateInput:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
        tone:
          type: string
          enum: [professional, casual, friendly, formal]

    EmailDraft:
      type: object
      required: [subject, body]
      properties:
        subject:
          type: string
        body:
          type: string

    EmailSendInput:
      type: object
      required: [to, subject, body]
      properties:
        to:
          type: string
          minLength: 3
        subject:
          type: string
        body:
          type: string
          minLength: 1

    SentEmail:
      type: object
      required: [id, toAddress, subject, body, createdAt]
      properties:
        id:
          type: integer
        toAddress:
          type: string
        subject:
          type: string
        body:
          type: string
        fromAddress:
          type: ["string", "null"]
        createdAt:
          type: string

    InboxCategory:
      type: object
      required: [key, label, count, capped, gmailUrl]
      properties:
        key:
          type: string
        label:
          type: string
        count:
          type: integer
        capped:
          type: boolean
        gmailUrl:
          type: string

    InboxSender:
      type: object
      required: [email, count, gmailUrl]
      properties:
        name:
          type: string
        email:
          type: string
        count:
          type: integer
        unsubscribeUrl:
          type: ["string", "null"]
        gmailUrl:
          type: string

    InboxScan:
      type: object
      required: [connected, scannedCount, categories, topSenders]
      properties:
        connected:
          type: boolean
        emailAddress:
          type: ["string", "null"]
        scannedCount:
          type: integer
        categories:
          type: array
          items:
            $ref: "#/components/schemas/InboxCategory"
        topSenders:
          type: array
          items:
            $ref: "#/components/schemas/InboxSender"
